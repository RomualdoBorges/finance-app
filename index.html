<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aplicação web para organização financeira pessoal."
    />
    <script>
      try {
        const storageKey = 'finance-app:interface-preferences'
        const storedPreferences = JSON.parse(
          localStorage.getItem(storageKey) ?? 'null',
        )
        const isValidPreferences =
          typeof storedPreferences === 'object' &&
          storedPreferences !== null &&
          !Array.isArray(storedPreferences) &&
          Object.keys(storedPreferences).length === 1
        const storedTheme = isValidPreferences
          ? storedPreferences.theme
          : undefined
        const theme =
          storedTheme === 'light' ||
          storedTheme === 'dark' ||
          storedTheme === 'system'
            ? storedTheme
            : 'system'
        const resolvedTheme =
          theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme

        document.documentElement.setAttribute('data-theme', resolvedTheme)
        document.documentElement.style.colorScheme = resolvedTheme
      } catch {
        const resolvedTheme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'

        document.documentElement.setAttribute('data-theme', resolvedTheme)
        document.documentElement.style.colorScheme = resolvedTheme
      }
    </script>
    <title>Financeiro — Fundação</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
