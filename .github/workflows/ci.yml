name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: 'fake-ci-api-key'
      VITE_FIREBASE_AUTH_DOMAIN: 'finance-app-dev-23ac7.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'finance-app-dev-23ac7'
      VITE_FIREBASE_STORAGE_BUCKET: 'finance-app-dev-23ac7.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      VITE_FIREBASE_USE_EMULATORS: 'true'
      VITE_FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1'
      VITE_FIREBASE_AUTH_EMULATOR_PORT: '9099'
      VITE_FIREBASE_FIRESTORE_EMULATOR_HOST: '127.0.0.1'
      VITE_FIREBASE_FIRESTORE_EMULATOR_PORT: '8080'
      VITE_FIREBASE_STORAGE_EMULATOR_HOST: '127.0.0.1'
      VITE_FIREBASE_STORAGE_EMULATOR_PORT: '9199'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package manager
        run: pnpm verify:package-manager

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Typecheck Functions
        run: pnpm functions:typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:run

      - name: Run Firestore Rules and integration tests
        run: pnpm test:rules

      - name: Build frontend
        run: pnpm build

      - name: Build Functions
        run: pnpm functions:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm test:e2e
